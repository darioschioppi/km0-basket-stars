<title>Area riservata – KM0 Basket Stars</title>
<style>
  :root { --accent:#e8590c; --bg:#fafafa; --card:#fff; --text:#222; --muted:#666; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  header { background:var(--accent); color:#fff; padding:2rem 1rem; text-align:center; }
  header h1 { margin:0 0 .25rem; font-size:1.8rem; }
  header p { margin:0; opacity:.9; }
  main { max-width:760px; margin:0 auto; padding:1rem; }
  section { background:var(--card); border-radius:12px; padding:1.25rem; margin:1rem 0; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  h2 { margin-top:0; color:var(--accent); font-size:1.25rem; }
  .note { color:var(--muted); font-size:.9rem; }
  table { width:100%; border-collapse:collapse; margin:.5rem 0; font-size:.95rem; }
  th, td { text-align:left; padding:.45rem .5rem; border-bottom:1px solid #eee; vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  tr.total td { font-weight:700; border-bottom:none; }
  .ok { color:#2b8a3e; font-weight:600; }
  form { display:flex; gap:.5rem; flex-wrap:wrap; }
  input[type=password] { flex:1; min-width:180px; padding:.6rem .75rem; border:1px solid #ccc; border-radius:8px; font-size:1rem; }
  button { background:var(--accent); color:#fff; border:0; padding:.6rem 1.1rem; border-radius:8px; font-weight:600; font-size:1rem; cursor:pointer; }
  button:hover { opacity:.9; }
  #err { color:#c92a2a; margin:.5rem 0 0; min-height:1.2em; }
  a { color:var(--accent); }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:1.5rem 1rem 2rem; }
</style>
</head>
<body>
<header>
  <h1>🔒 Area riservata</h1>
  <p>KM0 Basket Stars · Stagione 2026/2027</p>
</header>
<main>
  <section id="gate">
    <h2>Inserisci la password</h2>
    <p class="note">Questa pagina contiene dati di pagamento e quote dei soci, riservati ai partecipanti.</p>
    <form id="f">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus required>
      <button type="submit">Entra</button>
    </form>
    <p id="err"></p>
  </section>
  <div id="content"></div>
  <p><a href="./">← Torna alle info generali</a></p>
</main>
<footer>Pagina informativa non ufficiale del gruppo KM0 Basket Stars.</footer>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(P.i) }, key, b64(P.d));
  return new TextDecoder().decode(plain);
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const html = await unlock(document.getElementById('pw').value);
    document.getElementById('content').innerHTML = html;
    document.getElementById('gate').style.display = 'none';
  } catch (_) {
    err.textContent = 'Password errata.';
  }
});
